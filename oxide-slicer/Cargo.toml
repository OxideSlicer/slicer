[package]
name = "oxide-slicer"
version = "0.1.0"
edition = "2024"

[dependencies]
oxide-mesh.workspace = true

bevy = {version = "0.18.1", features = [
    "default_app",
    "3d_api",
    "3d_bevy_render",
    "bevy_winit",
    "multi_threaded",
    "x11",
    "wayland",
    "sysinfo_plugin"
]}
bevy_egui = {version = "0.39.1", features = [
    "manage_clipboard",
    "open_url",
    "default_fonts",
    "render",
    "accesskit"
]}
bevy_stl = {version = "0.18.0"}
rfd = "0.17.2"
